name: Deploy internal portal

# Runs when commits land on main, which only happens by merging a pull
# request. Re-runs the checks, builds and pushes the image to GHCR, then
# asks Dokploy to pull and run it. Dokploy never builds anything.
on:
  push:
    branches:
      - main
    paths:
      - "apps/internal/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".dockerignore"
      - ".github/workflows/ci.yml"
      - ".github/workflows/deploy-internal.yml"
  workflow_dispatch:

# Queue production deploys instead of cancelling one halfway through.
concurrency:
  group: deploy-internal-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}/internal

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml
    with:
      skip-docker-build: true

  image:
    name: Build and push image
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: latest, main, and sha-<short commit> for rollbacks.
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/internal/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=internal
          cache-to: type=gha,scope=internal,mode=max

  deploy:
    name: Deploy to Dokploy
    needs: image
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Dokploy is only reachable through the Cloudflare Tunnel hostname.
      # If that hostname is behind Cloudflare Access, the service token
      # headers let this runner through; otherwise they are omitted.
      - name: Trigger Dokploy deploy
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_APPLICATION_ID: ${{ vars.DOKPLOY_APPLICATION_ID }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          missing=""
          [ -n "$DOKPLOY_URL" ] || missing="$missing DOKPLOY_URL(variable)"
          [ -n "$DOKPLOY_APPLICATION_ID" ] || missing="$missing DOKPLOY_APPLICATION_ID(variable)"
          [ -n "$DOKPLOY_API_KEY" ] || missing="$missing DOKPLOY_API_KEY(secret)"
          if [ -n "$missing" ]; then
            echo "::error::The production environment is missing:$missing. The image was pushed to GHCR but not deployed."
            exit 1
          fi

          access_headers=()
          if [ -n "$CF_ACCESS_CLIENT_ID" ] && [ -n "$CF_ACCESS_CLIENT_SECRET" ]; then
            access_headers=(
              -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID"
              -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET"
            )
          fi

          curl --fail-with-body --silent --show-error \
            -X POST "${DOKPLOY_URL%/}/api/application.deploy" \
            -H "Content-Type: application/json" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            "${access_headers[@]}" \
            -d "{\"applicationId\":\"$DOKPLOY_APPLICATION_ID\"}"
          echo
          echo "Dokploy deploy triggered for application $DOKPLOY_APPLICATION_ID."
